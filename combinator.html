<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPFC Card Combo Maximizer</title>
    <link rel="stylesheet" href="combo_styles.css">
    <link rel="icon" href="tab-icon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script defer src="combos.js"></script>
</head>

<body>
    <h1>Nintendo Pocket Football Club: Card Combo Maximizer</h1>

    <div id="cardList">Loading cards...</div>

    <div id="optionsPanel">
        <strong>Optimization Mode:</strong><br>
        <label><input type="radio" name="optMode" value="skills" checked>Maximize Number of Skill Points</label><br>
        <label><input type="radio" name="optMode" value="cards">Randomize the Combo Set</label><br>
        <label><input type="radio" name="optMode" value="all">Show All Possible Combos</label>

        <br><br><strong>GK Combo Limit:</strong><br>
        <select id="gkLimitSelect">
            <option value="none">No Limit</option>
            <option value="2" selected>Limit to 2 GK Combos</option>
            <option value="1">Limit to 1 GK Combo</option>
            <option value="0">No GK Combos</option>
        </select>

        <br><br><strong>Restrictions:</strong><br>
        <label>
            <input type="checkbox" id="noHiddenCheckbox">
            Exclude Hidden (H) Combos
        </label>

        <br><br><strong>Max Combos in Set:</strong><br>
        <select id="comboLimitSelect">
            <!-- 25 is the max amount of players you can have on your team at once, so there's no need for this to go any higher -->
            <option value="25" selected>25 (Max)</option>
            <option value="24">24</option>
            <option value="23">23</option>
            <option value="22">22</option>
            <option value="21">21</option>
            <option value="20">20</option>
            <option value="19">19</option>
            <option value="18">18</option>
            <option value="17">17</option>
            <option value="16">16</option>
            <option value="15">15</option>
            <option value="14">14</option>
            <option value="13">13</option>
            <option value="12">12</option>
            <option value="11">11</option>
            <option value="10">10</option>
            <option value="9">9</option>
            <option value="8">8</option>
            <option value="7">7</option>
            <option value="6">6</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>
    </div>
    <br>

    <div id="buttonContainer">
        <button id="findCombosBtn">Find Combos</button>
        <button id="resetBtn">Reset Cards</button>
    </div>

    <div id="skillSortContainer" style="display:none; margin-top:46px;">
        <strong>Sort Displayed Combos By:</strong><br>
        <label><input type="checkbox" class="skillSort" value="Kicking"> Kicking</label>
        <label><input type="checkbox" class="skillSort" value="Speed"> Speed</label>
        <label><input type="checkbox" class="skillSort" value="Stamina"> Stamina</label>
        <label><input type="checkbox" class="skillSort" value="Technique"> Technique</label>
        <label><input type="checkbox" class="skillSort" value="Toughness"> Toughness</label>
        <label><input type="checkbox" class="skillSort" value="Jumping"> Jumping</label>
        <label><input type="checkbox" class="skillSort" value="Willpower"> Willpower</label><br>
    </div>

    <div id="results"></div>

    <footer>
        <hr>
        <p><a href="#">Back to Top</a> | <a href="combo_list.html">Combo List</a></p>
        <p><em>Created by: Seth Opatz, 10/06/2025<br>
               Last Updated: 06/25/2026</em></p>
    </footer>
</body>

</html>
